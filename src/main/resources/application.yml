spring:
  application:
    name: tontine-marche
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bd_tontine}
    username: ${DATABASE_USER:oservices}
    password: "Services@2025*!"
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:oliveservicespro@gmail.com}
    password: "snnc vdsq hmal akrr"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_TLS:true}
            required: ${MAIL_SMTP_TLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:TontineMarcheSecretKey2026SecureJwtTokenForAuthenticationAndAuthorization}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  commission:
    default-rate: 0.10
    admin-rate: 0.05
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:oliveservicespro@gmail.com}
    from-name: ${MAIL_FROM_NAME:Tontine Marché}
  notification:
    depense-seuil: ${DEPENSE_SEUIL:50000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  public:
    api-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8081}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    reset-token-minutes: ${OTP_RESET_TOKEN_MINUTES:15}
  super-admin:
    username: "${SUPER_ADMIN_USERNAME:admin}"
    password: "${SUPER_ADMIN_PASSWORD:*@Secret@*2018}"
    email: "${SUPER_ADMIN_EMAIL:dmoussa1807@gmail.com}"
    nom-complet: "${SUPER_ADMIN_NAME:Super Administrateur}"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.tontinemarche: INFO
    org.springframework.security: WARN
    org.springframework.mail: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:db/categorie-flags.sql
      continue-on-error: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
