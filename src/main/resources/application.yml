spring:
  application:
    name: tontine-marche
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./application-local.yml,optional:file:./backend_tontine/application-local.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bd_tontine}
    username: ${DB_USER:oservices}
    password: ${DB_PASSWORD:Services@2025*!}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${SMTP_USER:oliveservicespro@gmail.com}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_TLS:true}
            required: ${MAIL_SMTP_TLS_REQUIRED:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:TontineMarcheSecretKey2026SecureJwtTokenForAuthenticationAndAuthorization}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  commission:
    default-rate: 0.10
    admin-rate: 0.05
    # Mettre à true UNE FOIS au redémarrage pour appliquer la nouvelle grille
    # par défaut à toutes les agences, puis remettre à false.
    apply-default-grille-on-startup: ${APPLY_DEFAULT_GRILLE:false}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:oliveservicespro@gmail.com}}
    from-name: ${MAIL_FROM_NAME:Tontine Marché}
  notification:
    depense-seuil: ${DEPENSE_SEUIL:50000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-image-dimension: ${UPLOAD_MAX_DIMENSION:1600}
    max-image-bytes: ${UPLOAD_MAX_BYTES:1048576}
    jpeg-quality: ${UPLOAD_JPEG_QUALITY:0.82}
  public:
    api-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8081}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    reset-token-minutes: ${OTP_RESET_TOKEN_MINUTES:15}
  super-admin:
    username: "${SUPER_ADMIN_USERNAME:admin}"
    password: "${SUPER_ADMIN_PASSWORD:*@Secret@*2018}"
    email: "${SUPER_ADMIN_EMAIL:dmoussa1807@gmail.com}"
    nom-complet: "${SUPER_ADMIN_NAME:Super Administrateur}"

# Passerelle Android SMS Gateway (même API que eRDV)
# Clé / activation : variables d'env SMS_GATEWAY_* ou application-local.yml (non versionné)
sms:
  gateway:
    enabled: ${SMS_GATEWAY_ENABLED:false}
    api-key: ${SMS_GATEWAY_API_KEY:}
    url: ${SMS_GATEWAY_URL:https://europe-west1-sms-gateway-api-simpapp.cloudfunctions.net/api_v2_sms_send}
    request-timeout-seconds: ${SMS_GATEWAY_TIMEOUT_SECONDS:10}
    default-country-code: ${SMS_GATEWAY_DEFAULT_COUNTRY_CODE:+223}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.tontinemarche: INFO
    org.springframework.security: WARN
    org.springframework.mail: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:db/categorie-flags.sql
      continue-on-error: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.tontinemarche: WARN
    org.springframework.security: WARN
    org.springframework.mail: WARN
    org.hibernate: WARN
